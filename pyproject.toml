[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "lora-ticket-classifier"
version = "1.0.0"
requires-python = ">=3.12"
[project.optional-dependencies]
tuning = ["transformers>=4.45,<5", "datasets>=3,<4", "peft>=0.13,<1", "torch>=2.5,<3", "accelerate>=1,<2"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]
[project.scripts]
prepare-ticket-data = "ticket_tuning.infrastructure.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
